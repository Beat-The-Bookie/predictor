<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Account Settings – Beat the Bookie</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/x-icon" href="logo.jpg" />
    <link rel="stylesheet" href="styles.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />

    <script src="https://unpkg.com/@supabase/supabase-js"></script>

    <script src="scripts/auth.js"></script>
    <script src="scripts/header.js"></script>
    <script src="scripts/profile.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        loadHeader("Beat the Bookie");

        const {
          data: { session },
        } = await supaclient.auth.getSession();

        if (!session?.user) {
          window.location.href = "auth.html";
          return;
        }

        loadProfileSettings();
      });
    </script>
  </head>

  <body style="padding-top: 0%;">
    <div id="header-placeholder"></div>

    <div class="container mt-4" style="max-width: 900px">
      <div class="card mb-3">
        <div class="card-body">
          <h2 class="card-title">Account Settings</h2>

          <div class="mb-4">
            <h5>Email Preferences</h5>
            <p class="text-muted">Choose which emails you'd like to receive from us</p>

            <div class="form-check mb-3">
              <input
                class="form-check-input"
                type="checkbox"
                id="setting-deadline-reminders"
              />
              <label class="form-check-label" for="setting-deadline-reminders">
                <strong>Deadline Reminders</strong>
                <br />
                <small class="text-muted">Get notified when the prediction deadline is approaching</small>
              </label>
            </div>

            <div class="form-check mb-3">
              <input
                class="form-check-input"
                type="checkbox"
                id="setting-season-overview"
              />
              <label class="form-check-label" for="setting-season-overview">
                <strong>End-of-Season Overview</strong>
                <br />
                <small class="text-muted">Get a summary of the standings at the end of the season</small>
              </label>
            </div>

            <button
              class="btn btn-primary"
              onclick="updateEmailPreferences()"
              style="padding: 10px 24px; font-size: 1rem; border-radius: 6px"
            >
              Save Preferences
            </button>
          </div>

          <hr />

          <div class="mb-4">
            <h5>Account Information</h5>
            <div class="row mb-2">
              <label class="col-sm-3 col-form-label"><strong>Username:</strong></label>
              <div class="col-sm-9">
                <p class="form-control-plaintext" id="username-display">-</p>
              </div>
            </div>
            <div class="row mb-2">
              <label class="col-sm-3 col-form-label"><strong>Email:</strong></label>
              <div class="col-sm-9">
                <p class="form-control-plaintext" id="email-display">-</p>
              </div>
            </div>
          </div>

          <hr />

          <div>
            <a href="index.html" class="btn btn-secondary">Back to Home</a>
            <button
              class="btn btn-outline-danger"
              onclick="logout()"
              style="padding: 10px 24px; font-size: 1rem; border-radius: 6px"
            >
              Logout
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
